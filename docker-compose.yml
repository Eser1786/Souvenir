services:
  postgres:
    image: postgres:16-alpine
    container_name: souvenir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-souvenir_db}
      POSTGRES_USER: ${POSTGRES_USER:-souvenir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-souvenir_pass}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - souvenir_pgdata:/var/lib/postgresql/data
      # Các file .sql trong thư mục này chạy theo thứ tự tên, CHỈ ở lần đầu tạo volume
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-souvenir} -d ${POSTGRES_DB:-souvenir_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: souvenir-pgadmin
    restart: unless-stopped
    profiles: ["tools"]          # chỉ chạy khi: docker compose --profile tools up -d
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@souvenir.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  souvenir_pgdata: